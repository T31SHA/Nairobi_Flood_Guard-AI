name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # LFS objects (the ~100MB road graph) are not needed: unit tests use
        # synthetic graphs, and floods.gpkg / model artifacts are plain git.

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Data asset pre-check
        # Catches an un-pulled Git LFS pointer (e.g. ZIP download or clone
        # without LFS) instead of letting it fail silently downstream.
        # Non-blocking: per-push CI intentionally skips the LFS payload.
        run: python -m scripts.verify_data_assets
        continue-on-error: true

      - name: Test
        run: pytest tests -v
